name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Every gate runs again here: a tag can be pushed without a passing CI
      # run, and publishing is not reversible.
      - name: Unit tests
        run: npm test
      - name: Release consistency and registry check
        run: npm run release:check:registry
      - name: Tool listing over stdio
        run: npm run smoke:list-tools

      - name: Verify the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json $VERSION" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build the MCPB bundle
        run: npm run build:mcpb

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mcpb
          generate_release_notes: true
